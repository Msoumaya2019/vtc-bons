name: Android — APK et App Bundle

# Produit les trois fichiers Android, TOUS NON SIGNÉS :
#   • app-debug.apk            pour tester rapidement (signé avec la clé de debug)
#   • app-release-unsigned.apk à signer soi-même, par exemple avec eSign
#   • app-release.aab          à déposer sur Google Play Console
#
# Aucune clé de signature n'est stockée dans ce dépôt, qui est public.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    name: Construire les artefacts Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Installer Java 21
        # Capacitor 8 s'appuie sur Android Gradle Plugin 8.x, qui exige au minimum
        # Java 17. Java 21 est le choix recommandé par Capacitor.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        # v4 est requis : la v3 tente d'installer le paquet « tools », retiré du
        # dépôt Android, et échoue systématiquement.
        uses: android-actions/setup-android@v4
        with:
          # Le paquet « tools » figure dans la liste par défaut de l'action, alors
          # qu'il n'existe plus dans le dépôt Android. Sans cette précision,
          # l'installation s'arrête avant même la première compilation.
          packages: 'platform-tools'

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application web
        run: npm run build

      - name: Générer le projet Android
        # `android/` n'est pas versionné : il est recréé ici, à chaque compilation.
        run: |
          npx cap add android
          npx cap sync android

      - name: Déclarer l'accès à la position
        # Le manifeste du greffon de géolocalisation est VIDE : contrairement à la
        # permission INTERNET, qui vient de la bibliothèque Capacitor, les
        # permissions de localisation doivent être écrites dans le manifeste de
        # l'application. Sans elles, Android refuse la demande sans même afficher
        # de dialogue, et le bouton « Ma position » échoue.
        #
        # `android/` étant régénéré à chaque compilation, cette écriture se fait ici :
        # c'est le seul endroit qui survive à la régénération.
        run: |
          MANIFESTE=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFESTE" ]; then
            echo "::error::AndroidManifest.xml introuvable : le projet Android n'a pas été généré."
            exit 1
          fi

          sed -i 's|^    <application$|    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n\n    <application|' "$MANIFESTE"

          # Vérification : la substitution ci-dessus s'ancre sur l'indentation du
          # modèle de Capacitor. Si ce modèle change, elle ne ferait plus rien — et
          # l'application perdrait la position sans que rien ne le signale. On
          # s'arrête donc ici plutôt que de livrer un APK amputé.
          for PERMISSION in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            if ! grep -q "$PERMISSION" "$MANIFESTE"; then
              echo "::error::$PERMISSION n'a pas pu être écrite dans le manifeste."
              exit 1
            fi
          done

          # Contrôle final : le manifeste doit rester un XML valide. Un fichier
          # cassé ne se verrait qu'à la compilation Gradle, plus loin et moins
          # lisiblement.
          python3 -c "import xml.dom.minidom, sys; xml.dom.minidom.parse(sys.argv[1])" "$MANIFESTE"

          sed -n '1,10p' "$MANIFESTE"

      - name: Déclarer le raccourci d'écran d'accueil et le schéma vtcbons
        # Un appui long sur l'icône installée doit proposer « Bon instantané », qui ouvre
        # directement l'onglet correspondant. Ce raccourci ne peut PAS venir du manifeste
        # web : une application native ne lit pas `manifest.webmanifest`. Il se déclare donc
        # dans le projet Android, et `android/` étant régénéré à chaque compilation, la
        # déclaration se refait ici à chaque fois.
        #
        # Le travail est confié à un script versionné plutôt qu'écrit dans ce YAML : il
        # touche trois fichiers, vérifie après coup ce qu'il a écrit, et confronte le
        # raccourci à l'identifiant d'application réellement compilé. Tout cela se relit
        # dans `scripts/declarer-raccourci-android.py`, et s'éprouve en le lançant.
        #
        # Le raccourci lui-même est validé plus loin, par la compilation Gradle : `aapt2`
        # refuse un attribut inconnu à l'édition de liens. Le script, lui, se limite à
        # vérifier que les trois documents restent des XML bien formés — ce qui se voit ici,
        # et non au milieu d'une compilation Gradle.
        run: python3 scripts/declarer-raccourci-android.py android

      - name: APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK de production, non signé
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: App Bundle, non signé
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Vérifier que les trois fichiers existent
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          echo "Les trois artefacts sont présents."

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier l'APK de production non signé
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release-non-signe
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publier l'App Bundle non signé
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-non-signe
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
