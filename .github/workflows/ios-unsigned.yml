name: iOS — IPA non signé

# Produit un IPA NON SIGNÉ, destiné à être signé soi-même — par exemple avec eSign.
#
# Pourquoi non signé ? Signer exigerait un certificat Apple et un profil de
# provisionnement, c'est-à-dire des secrets. Ce dépôt est public : aucun certificat,
# aucun mot de passe, aucun profil n'y est stocké. La signature est faite localement,
# sur la machine de l'utilisateur, au moment de l'installation.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    name: Construire l'IPA non signé
    # macos-15 est nécessaire : Capacitor 8 exige Xcode 16, absent de macos-14.
    runs-on: macos-15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application web
        run: npm run build

      - name: Générer le projet iOS
        # `ios/` n'est pas versionné : il est recréé ici, à chaque compilation.
        # CocoaPods est déjà présent sur les exécuteurs macOS de GitHub.
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Déclarer l'usage de la position
        # iOS refuse une demande de position dont l'usage n'est pas expliqué, et
        # ferme brutalement l'application : les clés doivent être présentes, avec un
        # texte qui dit à quoi la position sert.
        #
        # Elles sont écrites ici, et non dans un fichier versionné, parce que `ios/`
        # est régénéré à chaque compilation : tout ce qui n'est pas réinjecté à ce
        # moment-là disparaît. C'est aussi la raison pour laquelle ce texte vit dans
        # le flux de travail, seul endroit qui survive à la régénération.
        #
        # `plistlib` plutôt que PlistBuddy : le texte est en français, donc accentué,
        # et un outil en ligne de commande le fait passer par l'encodage du shell.
        # `plistlib` lit et écrit l'UTF-8 sans détour, et relit ce qu'il vient
        # d'écrire — ce qui permet de vérifier au lieu d'espérer.
        run: |
          PLIST=ios/App/App/Info.plist
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist introuvable : le projet iOS n'a pas été généré."
            exit 1
          fi

          python3 - "$PLIST" <<'PYTHON'
          import plistlib
          import sys

          chemin = sys.argv[1]
          texte = (
              "Sert uniquement à préremplir l’adresse de prise en charge avec votre "
              "position actuelle. Aucune position n’est transmise : seule l’adresse "
              "que vous choisissez est enregistrée."
          )

          # Deux clés, et non une seule : le greffon s'appuie sur une bibliothèque
          # qui sait relever la position en arrière-plan, ce qui conduit Apple à
          # exiger aussi la variante « Always ». Aucun dialogue ne l'affiche jamais
          # — nous ne demandons que la position pendant l'usage — mais son absence
          # suffit à faire refuser la publication. Le texte est donc le même.
          cles = [
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ]

          with open(chemin, "rb") as fichier:
              contenu = plistlib.load(fichier)

          for cle in cles:
              contenu[cle] = texte

          with open(chemin, "wb") as fichier:
              plistlib.dump(contenu, fichier)

          # Relecture : une clé absente ou vide ne se verrait qu'au premier appui
          # sur « Ma position », c'est-à-dire sur le téléphone, après coup.
          with open(chemin, "rb") as fichier:
              relu = plistlib.load(fichier)

          for cle in cles:
              if relu.get(cle) != texte:
                  sys.exit(f"::error::{cle} n'a pas pu être écrite dans Info.plist.")
              print(f"{cle} : {relu[cle]}")

          print("Info.plist valide.")
          PYTHON

      - name: Déclarer le schéma d'adresse vtcbons
        # Sur iPhone, il n'existe pas de raccourci d'écran d'accueil au sens d'Android : le
        # chauffeur installe un raccourci de l'application « Raccourcis », qui ouvre une
        # adresse. Pour qu'iOS accepte de remettre « vtcbons://instantane » à cette
        # application, le schéma doit être DÉCLARÉ ici. Sans cette déclaration, iOS refuse
        # d'ouvrir l'adresse et le raccourci ne produit rien, sans le moindre message.
        #
        # `CFBundleURLTypes` est absent du modèle de Capacitor : la clé est donc créée.
        # Comme pour la position, l'écriture se fait ici, car `ios/` est régénéré à chaque
        # compilation.
        run: |
          PLIST=ios/App/App/Info.plist
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist introuvable : le projet iOS n'a pas été généré."
            exit 1
          fi

          python3 - "$PLIST" <<'PYTHON'
          import plistlib
          import sys

          chemin = sys.argv[1]
          SCHEMA = "vtcbons"

          with open(chemin, "rb") as fichier:
              contenu = plistlib.load(fichier)

          avant = set(contenu)

          # Une seule entrée : ce schéma sert au raccourci, pas à ouvrir des documents.
          # `CFBundleURLName` est un identifiant interne, jamais montré au chauffeur ; il
          # reprend la variable déjà employée par `CFBundleIdentifier`, plutôt que de
          # recopier l'identifiant de l'application à un second endroit.
          contenu["CFBundleURLTypes"] = [
              {
                  "CFBundleURLName": "$(PRODUCT_BUNDLE_IDENTIFIER)",
                  "CFBundleURLSchemes": [SCHEMA],
              }
          ]

          with open(chemin, "wb") as fichier:
              plistlib.dump(contenu, fichier)

          # Relecture : une déclaration absente ne se verrait que sur le téléphone, au
          # moment où le chauffeur appuie sur le raccourci et que rien ne s'ouvre.
          with open(chemin, "rb") as fichier:
              relu = plistlib.load(fichier)

          schemas = [
              schema
              for type_url in relu.get("CFBundleURLTypes") or []
              for schema in type_url.get("CFBundleURLSchemes") or []
          ]
          if SCHEMA not in schemas:
              sys.exit(f"::error::le schéma {SCHEMA} n'a pas pu être écrit dans Info.plist.")

          # Cette étape et celle de la position écrivent dans le MÊME fichier : la seconde
          # ne doit rien effacer de ce qu'a posé la première. Un réglage perdu ne se verrait
          # qu'au premier appui sur « Ma position », sur le téléphone, après coup.
          perdues = avant - set(relu)
          if perdues:
              sys.exit(f"::error::clés perdues dans Info.plist : {', '.join(sorted(perdues))}")

          for cle in (
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ):
              if not relu.get(cle):
                  sys.exit(f"::error::{cle} n'est plus renseignée dans Info.plist.")

          print(f"Schémas d'adresse déclarés : {', '.join(schemas)}")
          print("Info.plist valide.")
          PYTHON

      - name: Compiler sans signature
        working-directory: ios/App
        run: |
          # Capacitor 8 ne produit plus systématiquement un espace de travail
          # CocoaPods : selon la configuration, le projet est un simple
          # `App.xcodeproj` (Swift Package Manager). On prend donc ce qui existe
          # plutôt que de supposer, sinon xcodebuild s'arrête sur un
          # « App.xcworkspace does not exist ».
          if [ -d App.xcworkspace ]; then
            CIBLE=(-workspace App.xcworkspace)
          else
            CIBLE=(-project App.xcodeproj)
          fi
          echo "Cible de compilation : ${CIBLE[*]}"

          xcodebuild \
            "${CIBLE[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaqueter l'IPA
        # Un IPA n'est qu'une archive ZIP contenant un dossier `Payload/` qui
        # contient lui-même l'application `.app`.
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::Aucune application compilée n'a été trouvée."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry vtc-bons-non-signe.ipa Payload
          rm -rf Payload

          ls -lh vtc-bons-non-signe.ipa
          unzip -l vtc-bons-non-signe.ipa | head -n 20

      - name: Publier l'IPA non signé
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-non-signe
          path: vtc-bons-non-signe.ipa
          if-no-files-found: error
